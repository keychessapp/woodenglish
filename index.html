<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Speak 1000</title>
<style>
:root{--bg:#0f1420;--c:#171e2e;--c2:#222b3f;--tx:#e8ecf4;--mu:#8793ab;--ac:#5fd0c5;--rd:#ff6b7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:16px/1.35 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px 4px}
h1{font-size:19px;margin:0;flex:1;font-weight:650;letter-spacing:-.01em}h2{margin:0 0 6px;font-size:17px}
main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px 14px 8px}
nav,.pn{display:flex;gap:8px;background:var(--c);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;padding:10px 0;background:none;border:0;color:var(--mu);font:inherit;font-size:14px;border-radius:12px}
nav .on{color:var(--ac);background:var(--c2)}
.card{background:var(--c);border-radius:18px;padding:16px;margin:10px 0}
.card p{margin:4px 0;color:var(--mu)}.card b{color:var(--tx)}
.big{font-size:46px;font-weight:700;line-height:1}.big small{font-size:15px;color:var(--mu);font-weight:400}
.bar{height:8px;background:var(--c2);border-radius:8px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--ac)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:16px;background:var(--ac);color:#08211e;font:inherit;font-weight:650;margin:10px 0}
.ghost{background:var(--c2);color:var(--tx)}.danger{background:#3a1d26;color:var(--rd)}
.chip{border:0;background:var(--c2);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px}
.row{background:var(--c);border-radius:14px;border-left:3px solid var(--ac);padding:8px 10px;margin:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.b{border-left-color:#a78bfa}
.sp{width:24px;height:24px;border-radius:50%;background:var(--c2);display:grid;place-items:center;font-size:12px;color:var(--mu);flex:none}
.row p{margin:0;flex:1;font-size:clamp(13px,2vh,15px);line-height:1.3;min-width:40%}.ic{display:flex;gap:6px;flex:none}.rv .ic{flex-basis:100%;justify-content:flex-end}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:var(--c2);color:var(--tx);font-size:15px;display:grid;place-items:center}
.rc{border:2px solid var(--rd);background:transparent;position:relative}.rc::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--rd)}
.rc.on{background:var(--rd)}.rc.on::after{background:#fff;border-radius:3px;width:12px;height:12px}.rc.on{animation:p 1s infinite}
@keyframes p{50%{box-shadow:0 0 0 8px #ff6b7a33}}
.dt{width:32px;height:32px;border-radius:50%;border:1px solid var(--mu);background:none;color:var(--mu);font-size:12px}
.dt.f{background:var(--ac);border-color:var(--ac);color:#08211e}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--c);color:var(--tx);font:inherit;padding:9px 14px;border-radius:14px;margin:5px 0}.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gr .li{margin:0;font-size:13px;flex-direction:column;align-items:flex-start;gap:2px}
.li span{flex:1}.li small{color:var(--mu)}
.td{padding:0 14px 6px;color:var(--mu);font-size:13px}.td b{color:var(--ac)}.md{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:9}.md .card{width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 4px;text-align:left;border-bottom:1px solid var(--c2)}th{color:var(--mu);font-weight:500}
.pn .btn{margin:0;flex:1;padding:11px}.pn .c{align-self:center;color:var(--mu);font-size:13px;min-width:54px;text-align:center}
</style></head><body><div id="app"></div><audio id="au" preload="metadata" src="merged_audio.mp3"></audio>
<script>
const D={"k":["BASIC SMALL TALK & INTRODUCTIONS","PAST EXPERIENCES & CATCHING UP","LIKES, DISLIKES, PREFERENCES & INVITATIONS","OBJECTS, PROCESSES, FEATURES & INSTRUCTIONS","PROBLEMS, ADVICE & SYMPATHY","DECISIONS, PLANS & FUTURE GOALS","OPINIONS, AGREEMENT & DISCUSSION OPENERS","GROUP DISCUSSIONS, FLOOR CONTROL & CLARIFICATIONS","SERIOUS SUBJECTS, INDIRECT LANGUAGE & NEGOTIATION","SPECIAL OCCASIONS, PUBLIC SPEAKING & COMPLEX NUANCES"],"c":[{"p":0,"n":"Meeting at an Airport Café","h":[[1,"A","Excuse me, is anyone sitting here?",0.088,2.71],[2,"B","No, it's free. Please, go ahead and sit down.",2.798,6.41],[3,"A","Thanks a lot. I'm Chanwon, by the way.",6.485,9.31],[4,"B","Nice to meet you, Chanwon. I'm Mark.",9.372,12.74],[5,"A","Pleased to meet you, Mark. Are you waiting for a flight too?",12.84,16.17],[6,"B","Yes, I'm waiting for the connecting flight to Seattle.",16.27,19.43]]},{"p":0,"n":"Talking About Where You Come From","h":[[7,"A","So, where do you call home?",19.53,21.33],[8,"B","I come from Seoul, South Korea. And how about you?",21.43,25.12],[9,"A","I'm from Hamburg, Germany. Is this your first time in the US?",25.208,29.01],[10,"B","Yes, it's my very first visit. I'm here to study English for a year.",29.11,34.07],[11,"A","That sounds very exciting indeed! How long have you been here so far?",34.158,38.65],[12,"B","I've just arrived today, so everything feels quite new to me.",38.812,42.87]]},{"p":0,"n":"Talking About Work and Occupation","h":[[13,"A","What do you do for a living?",42.958,44.72],[14,"B","I'm an electronic engineering student. What line of work are you in?",44.808,49.09],[15,"A","I'm in advertising. I work for a firm downtown.",49.178,53.05],[16,"B","Now, isn't that interesting! Do you enjoy your job?",53.125,56.22],[17,"A","Yes, I really love it, though it can get pretty busy at times.",56.308,60.37],[18,"B","I can imagine! It must be very challenging.",60.47,63.78]]},{"p":0,"n":"Commenting on the Weather","h":[[19,"A","Nice day, isn't it?",63.83,65.63],[20,"B","It sure is! The sun is finally out after days of rain.",65.718,69.93],[21,"A","Are you used to sunny weather like this back home?",70.03,72.52],[22,"B","Well, our summers are quite warm, but winters can get really cold.",72.595,76.82],[23,"A","Same here. I definitely prefer warm sunshine over rain any day.",76.882,81.43],[24,"B","Me, too! Let's hope the warm weather stays all week.",81.505,84.91]]},{"p":0,"n":"Asking Indirect Questions Politely","h":[[25,"A","Excuse me, would you happen to know if there's a bank near here?",84.985,89.04],[26,"B","Yes, there's one right around the corner next to the coffee shop.",89.128,93.38],[27,"A","Could you tell me if it's open at this hour?",93.468,95.71],[28,"B","I believe it stays open until five o'clock today.",95.81,98.88],[29,"A","Thank you so much! I really appreciate your help.",98.98,102.24],[30,"B","You're very welcome! Have a great day.",102.328,105.14]]},{"p":0,"n":"Introductions at a Gathering","h":[[31,"A","May I introduce myself? My name is Jun-Hwi.",105.215,108.96],[32,"B","How do you do, Jun-Hwi. I'm Mary Sutherland.",109.048,112.73],[33,"A","It's a pleasure to make your acquaintance, Mary.",112.83,115.44],[34,"B","The pleasure is all mine. Are you enjoying the event so far?",115.54,119.76],[35,"A","Yes, absolutely. It's a wonderful opportunity to meet people.",119.848,124.13],[36,"B","I couldn't agree more. Let me introduce you to my colleague, Steve.",124.218,128.57]]},{"p":0,"n":"Asking About Hobbies","h":[[37,"A","What do you like to do in your spare time?",128.658,130.68],[38,"B","I'm really into photography and hiking. What about you?",130.78,134.57],[39,"A","I tend to spend my leisure time reading or listening to music.",134.658,138.36],[40,"B","That sounds very relaxing! What kind of music are you into?",138.448,142.39],[41,"A","I'm heavily into classical jazz and acoustic guitar.",142.478,145.92],[42,"B","Wow, that's awesome! Jazz is right up my alley as well.",146.008,149.47]]},{"p":0,"n":"Checking Flight Details at the Terminal","h":[[43,"A","Sorry to bother you, but is this gate for the flight to Chicago?",149.57,153.48],[44,"B","Yes, it is. Though I think the boarding has been delayed slightly.",153.555,157.39],[45,"A","Oh, really? Did they announce how long the delay will be?",157.478,160.87],[46,"B","They said about twenty minutes. Nothing too major.",160.958,164.37],[47,"A","That's a relief! I was worried I might miss my connection.",164.47,168.47],[48,"B","Don't worry, we should all be on our way very soon.",168.558,171.71]]},{"p":0,"n":"Staying in Touch Before Departure","h":[[49,"A","It's been really great talking to you, Mark.",171.798,174.23],[50,"B","Same here! We should definitely stay in touch.",174.292,177.42],[51,"A","That's a deal. Here is my email address and phone number.",177.508,181.33],[52,"B","Thanks! Don't forget to give me a call when you're in town next.",181.418,185.84],[53,"A","You can count on it! Have an enjoyable flight back.",185.928,189.08],[54,"B","Thanks, you too! Take care now.",189.18,191.77]]},{"p":0,"n":"Saying Good-bye at the End of Small Talk","h":[[55,"A","Well, it looks like they're starting to board my flight now.",191.858,195.06],[56,"B","I'm glad we met, Chanwon. Safe travels!",195.148,198.95],[57,"A","Thank you! I enjoyed our conversation immensely.",199.1,202.65],[58,"B","Me, too. Good luck with your studies in Seattle!",202.738,206.03],[59,"A","Thanks a lot. All the best to you, too!",206.118,208.81],[60,"B","See you around! Bye now.",208.91,211.14]]},{"p":0,"n":"Breaking the Ice at a Hotel Lobby","h":[[61,"A","Excuse me, are you staying at this hotel as well?",211.228,214.6],[62,"B","Yes, I checked in just this afternoon.",214.675,217.26],[63,"A","So, what brings you to San Francisco?",217.348,220.16],[64,"B","I'm here on business for an international tech conference.",220.248,223.47],[65,"A","That sounds interesting! Is this your first time in the city?",223.57,227.0],[66,"B","No, I've been here once before, but only for a quick trip.",227.088,231.34],[67,"A","Well, I hope you get a chance to see more of the sights this time.",231.415,235.06],[68,"B","I certainly hope so, too! Thank you.",235.148,237.89]]},{"p":0,"n":"Asking About Experiences in a New City","h":[[69,"A","How do you like living here so far?",237.99,240.0],[70,"B","I really love it! The city is so vibrant and diverse.",240.088,244.06],[71,"A","Have you gotten used to the local food yet?",244.16,246.32],[72,"B","Mostly yes, though I'm still trying out new restaurants every weekend.",246.408,250.9],[73,"A","Would you happen to know a good seafood restaurant nearby?",250.988,253.78],[74,"B","Actually, Fisherman's Wharf has some fantastic places.",253.868,257.81],[75,"A","Awesome! I'll definitely check that out tomorrow.",257.885,261.05],[76,"B","You won't be disappointed! Enjoy your meal.",261.15,264.22]]},{"p":0,"n":"Simple Everyday Greetings and Check-in","h":[[77,"A","Hi there! How are you doing today?",264.345,266.93],[78,"B","I'm doing just fine, thanks! How about yourself?",267.018,270.77],[79,"A","Pretty good! Can't complain at all.",270.858,273.48],[80,"B","Glad to hear that! Are you on your way to work?",273.568,276.55],[81,"A","Yes, heading to the office downtown.",276.625,279.24],[82,"B","Have a productive day at work then!",279.34,281.33],[83,"A","Thanks! Wishing you a pleasant day as well.",281.418,284.33],[84,"B","Thanks! Take care!",284.405,286.32]]},{"p":0,"n":"Exchanging Compliments on Style","h":[[85,"A","By the way, I really like your jacket!",286.47,288.96],[86,"B","Why, thanks! That's very kind of you to notice.",289.048,292.58],[87,"A","Bright colors really suit you well.",292.68,294.72],[88,"B","I appreciate the compliment! I bought it during my trip to Italy.",294.87,299.02],[89,"A","Italian fashion is always so stylish.",299.108,302.38],[90,"B","You can say that again! It's one of my favorite purchases.",302.468,306.2],[91,"A","It looks fantastic on you.",306.3,308.05],[92,"B","Thank you so much! Have a wonderful afternoon.",308.15,311.31]]},{"p":0,"n":"Wrapping Up a Brief Casual Conversation","h":[[93,"A","I'd better get moving now, or I'll be late for my appointment.",311.41,315.15],[94,"B","Of course! I don't want to keep you any longer.",315.225,318.25],[95,"A","It was a pleasure meeting you today.",318.338,320.36],[96,"B","Likewise! I hope we meet again soon.",320.435,323.41],[97,"A","I hope so, too. Take it easy!",323.498,326.27],[98,"B","You too! Bye-bye.",326.345,328.36],[99,"A","Bye!",328.435,330.21],[100,"B","See ya!",330.272,332.06]]},{"p":1,"n":"Running Into an Old Friend","h":[[101,"A","Say, Paolo! I don't believe it! Is that really you?",332.148,335.59],[102,"B","Hey, long time no see! What a pleasant surprise!",335.69,339.17],[103,"A","It's so great to see you again! You haven't changed a bit.",339.258,342.67],[104,"B","Thanks! Neither have you. It's been ages since we last met.",342.745,347.33],[105,"A","I know! How have you been getting along all this time?",347.418,350.91],[106,"B","Couldn't be better, honestly! How about yourself?",350.985,354.34]]},{"p":1,"n":"Addressing Someone You Recognize","h":[[107,"A","Excuse me, I don't mean to be forward, but don't I know you from somewhere?",354.428,359.09],[108,"B","You look very familiar, too! Don't I know you from last year's book fair in Frankfurt?",359.178,364.83],[109,"A","Yes, exactly! I was presenting at the language booth.",364.93,368.29],[110,"B","I thought so! What a small world, isn't it?",368.378,371.55],[111,"A","It really is! What have you been up to since then?",371.612,374.89],[112,"B","Well, I moved to a new position in publishing recently.",374.965,378.8]]},{"p":1,"n":"Catching Up on Shared Memories","h":[[113,"A","Do you remember when we held that mock debate in our afternoon class?",378.875,382.83],[114,"B","Oh, absolutely! Didn't we have a good time back then?",382.918,386.09],[115,"A","Those were the good old days! I miss our old study group.",386.178,389.88],[116,"B","Me, too! Have you heard anything from Tomoko lately?",389.968,394.03],[117,"A","I haven't heard from her for ages, but the last I heard she got promoted.",394.118,398.42],[118,"B","That's great news! I'm really happy for her.",398.508,401.52]]},{"p":1,"n":"Introducing Past Travel Anecdotes","h":[[119,"A","So, tell me, how did your visit to New York turn out?",401.62,405.48],[120,"B","You'll never guess what happened to me while I was there!",405.58,408.26],[121,"A","Really? I'm dying to hear all about it! Fill me in.",408.348,412.17],[122,"B","Well, to begin with, our flight got delayed for four hours in Phoenix.",412.245,417.21],[123,"A","Oh no! What did you do in the meantime?",417.298,420.16],[124,"B","We just explored the airport shops and grabbed a bite to eat.",420.235,423.69]]},{"p":1,"n":"Using Discourse Markers in Storytelling","h":[[125,"A","So, after we finally arrived at the hotel, you know, it started pouring rain.",423.765,429.19],[126,"B","Uh-oh, so what did you do then?",429.29,431.33],[127,"A","Well, see, we decided to check out the indoor art gallery instead.",431.43,436.2],[128,"B","Now, isn't that a great backup plan! How was the exhibition?",436.275,440.57],[129,"A","It was, like, the most fascinating show I've ever seen!",440.658,444.36],[130,"B","That sounds like a wonderful experience after all.",444.448,447.34]]},{"p":1,"n":"Talking About Work Transitions","h":[[131,"A","Whatever became of your plans to start your own consulting firm?",447.428,451.28],[132,"B","Well, as a matter of fact, I took the plunge last October!",451.355,455.12],[133,"A","You don't say! That must have taken a lot of courage.",455.208,458.58],[134,"B","It did, but it has worked out really well so far.",458.668,461.99],[135,"A","I'm so glad to hear that! You must be very proud.",462.078,465.45],[136,"B","Thank you! It's been hard work, but very rewarding.",465.6,469.36]]},{"p":1,"n":"Discussing Recent Life Events","h":[[137,"A","So, what's new with you these days? What's the scoop?",469.448,472.36],[138,"B","Well, guess what? We bought a new house out in the countryside!",472.448,476.39],[139,"A","You're kidding! Congratulations! How long have you lived there?",476.49,480.78],[140,"B","We've been there since January, so about five months now.",480.868,484.57],[141,"A","How are you liking the quiet lifestyle?",484.682,486.95],[142,"B","We love it! It's so peaceful compared to the city.",487.05,490.31]]},{"p":1,"n":"Time Expressions and Deadlines","h":[[143,"A","When is your project presentation due?",490.398,492.78],[144,"B","It has to be finished by Friday morning at nine o'clock.",492.868,496.16],[145,"A","Have you been working on it for a long time?",496.26,498.75],[146,"B","I've been working on it since last week, during the evenings.",498.85,502.64],[147,"A","Do you think you'll manage to finish it on time?",502.728,505.04],[148,"B","Yes, as long as I stay focused, I should be done by tomorrow night.",505.14,509.94]]},{"p":1,"n":"Expressing Pleasure in Past Reunions","h":[[149,"A","I really enjoyed seeing you again after all these years.",510.028,513.78],[150,"B","Me, too! I'm so glad we ran into each other today.",513.855,517.72],[151,"A","We definitely shouldn't wait another five years to get together.",517.808,521.87],[152,"B","You can say that again! Let's keep in touch regularly from now on.",521.958,526.07],[153,"A","Agreed! I'll send you an email over the weekend.",526.145,529.57],[154,"B","Sounds great! Take care of yourself.",529.67,532.38]]},{"p":1,"n":"Ending a Catch-up Conversation","h":[[155,"A","Well, I have to run now to pick up my daughter from school.",532.468,536.17],[156,"B","Sure thing! Don't let me keep you.",536.27,538.69],[157,"A","It was fantastic catching up with you.",538.79,541.35],[158,"B","Likewise! Give my best regards to your family.",541.412,545.14],[159,"A","Will do! Catch you later!",545.202,547.47],[160,"B","Bye! Take it easy!",547.558,549.51]]},{"p":1,"n":"Detailed Narrative of a Trip Mishap","h":[[161,"A","Did anything unusual happen to you on your vacation in France?",549.585,553.47],[162,"B","First off, we lost our luggage right after landing in Paris.",553.62,557.57],[163,"A","Oh, no! What a nightmare! What did you do?",557.658,561.1],[164,"B","Along the way, we had to buy emergency clothes at a local market.",561.188,565.54],[165,"A","In the meantime, did the airline manage to trace your bags?",565.615,569.4],[166,"B","Eventually, yes! They delivered them to our hotel two days later.",569.488,573.6],[167,"A","Well, at least everything worked out in the end!",573.688,576.58],[168,"B","Exactly! It made for an unforgettable adventure.",576.655,580.59]]},{"p":1,"n":"Asking About Former Classmates","h":[[169,"A","I wonder what ever became of Guido after graduation.",580.678,584.05],[170,"B","Did you know that Andre got married and moved to Canada?",584.138,587.63],[171,"A","Really? Wow, Anastasia told me she lost touch with him years ago.",587.718,592.55],[172,"B","Yes, we used to email, but lately we seem to have lost touch as well.",592.638,596.94],[173,"A","It's so hard to keep up with everyone when people move around.",597.015,600.52],[174,"B","That's true, but social media helps a bit nowadays.",600.608,604.34],[175,"A","Very true! I'll look him up online tonight.",604.415,607.34],[176,"B","Let me know if you find him!",607.44,609.19]]},{"p":1,"n":"Expressing Nostalgia and Shared History","h":[[177,"A","Wasn't the food in the university cafeteria just awful back then?",609.278,613.2],[178,"B","Haha, yes! But remember how much fun we had sitting there for hours?",613.312,617.54],[179,"A","Don't you miss those late-night study sessions before exams?",617.628,620.85],[180,"B","I sure do! We used to drink endless cups of coffee.",620.925,624.91],[181,"A","Those were the good old times, weren't they?",624.998,627.31],[182,"B","They certainly were! We created some wonderful memories.",627.398,630.89],[183,"A","I'm so glad we survived those tough exam weeks!",630.978,634.15],[184,"B","Me, too! We made a great team.",634.225,636.77]]},{"p":1,"n":"Sequential Event Description","h":[[185,"A","How did your presentation go at the conference yesterday?",636.882,640.35],[186,"B","To start with, the projector didn't work for the first ten minutes.",640.425,644.96],[187,"A","Oh, that must have been nerve-wracking!",645.048,647.98],[188,"B","Then, once we fixed it, the audience was extremely engaged.",648.068,652.44],[189,"A","Next thing you know, everyone was asking great questions!",652.515,656.14],[190,"B","Exactly! So in the end, it turned out to be a big success.",656.215,660.6],[191,"A","That's fantastic! I knew you'd do great.",660.688,663.58],[192,"B","Thank you! I appreciate your support.",663.742,666.36]]},{"p":1,"n":"Parting Words After Reconnecting","h":[[193,"A","Look me up next time you're in town!",666.448,668.4],[194,"B","I'll sure try! And drop in sometime if you visit Chicago.",668.488,672.7],[195,"A","You bet! Give me a call whenever you're around.",672.788,676.23],[196,"B","You can count on it! It was great seeing you again.",676.318,679.4],[197,"A","Wishing you a safe trip home!",679.5,681.44],[198,"B","Same to you! Goodbye!",681.528,683.55],[199,"A","Bye!",683.625,685.4],[200,"B","Take care!",685.488,687.25]]},{"p":2,"n":"Expressing Likes and Dislikes in Food","h":[[201,"A","How do you like Italian food?",687.362,689.1],[202,"B","I'm crazy about pasta and pizza! How about you?",689.2,692.7],[203,"A","I love pasta, but I can't stand greasy food.",692.788,696.06],[204,"B","I can't, either. I prefer light, fresh ingredients.",696.148,700.4],[205,"A","Same here! Fresh salad with olive oil is right up my alley.",700.488,704.65],[206,"B","You bet! It's healthy and delicious.",704.725,707.7]]},{"p":2,"n":"Stating Preferences Between Options","h":[[207,"A","Would you rather get coffee or tea this afternoon?",707.788,710.56],[208,"B","I'd much rather get coffee than tea. How about you?",710.648,714.06],[209,"A","I prefer tea to coffee, especially green tea.",714.148,717.49],[210,"B","Fair enough! Everyone has different tastes.",717.665,720.42],[211,"A","True! I'd choose a quiet café over a noisy place any day.",720.495,724.79],[212,"B","Me, too. Let's find a cozy place around the corner.",724.878,728.29]]},{"p":2,"n":"Making and Accepting Offers Politely","h":[[213,"A","Would you like a cup of coffee or something cold to drink?",728.378,731.55],[214,"B","Yes, please. That would be lovely! Thank you.",731.638,735.1],[215,"A","How about a slice of homemade apple pie as well?",735.2,738.08],[216,"B","That's very kind of you to offer! I'd love a small piece.",738.168,741.78],[217,"A","Here you go! Let me know if you need anything else.",741.855,744.92],[218,"B","This looks delicious! Thanks a million.",745.008,747.63]]},{"p":2,"n":"Refusing an Offer Gracefully","h":[[219,"A","Can I get you another drink or some dessert?",747.705,750.17],[220,"B","Thanks, but I'd rather not. I've had enough, thank you.",750.27,754.54],[221,"A","Are you sure? There's still plenty left!",754.628,757.25],[222,"B","I'm good, thanks! The meal was absolutely fantastic.",757.35,762.03],[223,"A","I'm glad you enjoyed it!",762.118,763.88],[224,"B","I really did. Thanks for your wonderful hospitality.",763.98,767.67]]},{"p":2,"n":"Extending an Invitation for Dinner","h":[[225,"A","I was wondering if you'd care to join us for dinner on Friday?",767.77,771.2],[226,"B","That sounds like fun! I'd love to come.",771.288,774.06],[227,"A","Great! Dinner is on me—my treat!",774.135,776.8],[228,"B","Oh, you don't have to do that! But thank you so much.",776.888,779.99],[229,"A","It's my pleasure! Is six-thirty all right with you?",780.078,783.4],[230,"B","Six-thirty is perfect. I look forward to it!",783.488,786.4]]},{"p":2,"n":"Declining an Invitation Politely","h":[[231,"A","Do you feel like going to the cinema with us tonight?",786.488,788.9],[232,"B","I'd love to, but unfortunately I've got other commitments.",788.988,792.79],[233,"A","Oh, that's a pity! Maybe another time then?",792.878,795.62],[234,"B","I appreciate the invitation, but tonight is just difficult.",795.708,799.94],[235,"A","No problem at all! We'll plan something for next week.",800.028,803.44],[236,"B","Sounds like a plan! Thanks for asking me.",803.502,806.18]]},{"p":2,"n":"Talking About Hobbies and Shared Interests","h":[[237,"A","Do you have any favorite leisure activities?",806.28,808.53],[238,"B","I'm heavily into outdoor sports, especially snowboarding and swimming.",808.618,813.5],[239,"A","Norbert is involved in outdoor sports, too! You share common ground.",813.562,818.52],[240,"B","Really? We should plan a hiking trip together sometime.",818.595,822.19],[241,"A","That's a great idea! We both share the same interests.",822.278,825.81],[242,"B","Definitely! It's always great to meet fellow outdoor enthusiasts.",825.91,830.08]]},{"p":2,"n":"Paying Compliments on Attire","h":[[243,"A","I'd like to compliment you on your outfit today!",830.18,832.7],[244,"B","Really? Do you think so? Thank you!",832.775,835.92],[245,"A","Those shoes go really well with your suit.",836.02,838.42],[246,"B","Thanks for noticing! I just bought them last weekend.",838.532,841.83],[247,"A","You look fantastic! That style really becomes you.",841.918,845.33],[248,"B","I appreciate the compliment! That made my day.",845.48,848.86]]},{"p":2,"n":"Discussing Music Preferences","h":[[249,"A","What kind of music are you into lately?",848.948,851.33],[250,"B","I'm really into classical music and acoustic guitar.",851.43,855.0],[251,"A","What do you think of rock or pop music?",855.088,857.3],[252,"B","I don't care much for heavy metal, but rock is okay.",857.388,860.83],[253,"A","Neither do I. I prefer something more relaxing after work.",860.905,865.22],[254,"B","Same goes for me. Soothing music helps me wind down.",865.27,869.64]]},{"p":2,"n":"Rejoinders of Agreement and Disagreement","h":[[255,"A","I can't stand waiting in long lines at the store.",869.74,872.54],[256,"B","I can't, either! It's such a waste of time.",872.628,875.35],[257,"A","And I love getting up early on weekends to exercise.",875.438,878.64],[258,"B","So do I! It gives you so much energy for the day.",878.728,882.43],[259,"A","Exactly! There's nothing better than starting the day fresh.",882.505,886.29],[260,"B","You said it!",886.378,888.14]]},{"p":2,"n":"Planning a Weekend Gathering","h":[[261,"A","What do you say to ordering pizza and watching a movie on Saturday?",888.228,892.1],[262,"B","That sounds like a great idea! What movie would you prefer?",892.2,895.6],[263,"A","I'd go for an action movie instead of a comedy.",895.7,898.67],[264,"B","Action sounds good to me, too! Who else should we invite?",898.745,902.03],[265,"A","How about if we invite Sarah and Mike?",902.13,904.43],[266,"B","Sure! I'm sure they wouldn't want to miss it.",904.492,907.19],[267,"A","Great! I'll call them right away to confirm.",907.278,910.07],[268,"B","Awesome! Saturday is going to be fun.",910.158,912.81]]},{"p":2,"n":"Exploring Leisure Time Activities","h":[[269,"A","How do you spend your spare time on weekends?",912.922,915.28],[270,"B","I spend most of my free time gardening or reading novels.",915.38,919.0],[271,"A","Chia finds gardening stimulating as well.",919.1,921.62],[272,"B","Is that so? I find it very therapeutic after a busy week.",921.708,926.13],[273,"A","Do you belong to any local gardening clubs?",926.23,928.99],[274,"B","Yes, I'm a member of the community garden project downtown.",929.065,933.02],[275,"A","That must be very rewarding!",933.108,934.92],[276,"B","It really is! You should come visit us sometime.",934.995,938.3]]},{"p":2,"n":"Offering Help and Responding Warmly","h":[[277,"A","Shall I bring some snacks or drinks to the party?",938.388,941.08],[278,"B","No, just bring yourself! Everything is taken care of.",941.155,945.02],[279,"A","Are you sure? I'd be more than happy to contribute.",945.095,948.6],[280,"B","That's sweet of you, but we've got plenty of food.",948.662,951.48],[281,"A","Well, at least let me bring a bottle of wine.",951.555,954.48],[282,"B","Okay, that would be lovely! Thank you!",954.568,957.02],[283,"A","My pleasure! What time should we arrive?",957.12,959.92],[284,"B","Around seven o'clock would be great.",960.008,962.34]]},{"p":2,"n":"Discussing Cultural and Entertainment Tastes","h":[[285,"A","What do you think of modern art exhibitions?",962.428,964.81],[286,"B","To be honest, modern art intrigues me quite a bit.",964.885,967.91],[287,"A","Really? I tend to prefer classical painting over modern art.",967.972,972.18],[288,"B","I understand! Classical art has incredible detail.",972.268,976.36],[289,"A","My first choice would be visiting historical museums.",976.435,979.86],[290,"B","Historical museums are of great interest to me as well.",979.948,983.48],[291,"A","We should definitely go to the city museum together.",983.58,986.53],[292,"B","I'd love to! Let me know when you're free.",986.618,989.46]]},{"p":2,"n":"Casual Refusal and Alternative Proposal","h":[[293,"A","Do you fancy going out for sushi tonight?",989.535,991.81],[294,"B","I'm good, thanks! I'm not really into raw fish.",991.91,995.67],[295,"A","No problem! How about going for Mexican food instead?",995.758,999.53],[296,"B","Mexican food is right up my alley! That sounds great.",999.592,1003.35],[297,"A","Awesome! I'll reserve a table for two at eight.",1003.45,1006.35],[298,"B","Sounds perfect! Thanks for taking my preference into account.",1006.4,1010.19],[299,"A","Anytime! See you at eight!",1010.252,1012.35],[300,"B","See you then!",1012.462,1014.2]]},{"p":3,"n":"Showing Off a New Tech Gadget","h":[[301,"A","Hey, check this out! Take a look at my new tablet.",1014.312,1017.39],[302,"B","Wow! Get a load of that sleek screen! What brand is it?",1017.478,1021.66],[303,"A","It's the latest Mango pad. It came out just last week.",1021.76,1025.26],[304,"B","That must have cost you an arm and a leg!",1025.335,1027.66],[305,"A","Actually, it was on sale, so it was pretty reasonable.",1027.748,1031.24],[306,"B","Man, everybody's talking about this model!",1031.315,1034.24]]},{"p":3,"n":"Describing Materials and Origin","h":[[307,"A","What is this tool made of?",1034.328,1036.09],[308,"B","It's constructed of high-grade stainless steel and aluminum.",1036.14,1039.86],[309,"A","Where was it manufactured?",1039.935,1041.71],[310,"B","It was designed in Germany and assembled in Japan.",1041.798,1044.85],[311,"A","Is it durable and waterproof?",1044.938,1046.79],[312,"B","Yes, it's completely heat-resistant and waterproof.",1046.865,1050.65]]},{"p":3,"n":"Asking About Functions and Features","h":[[313,"A","What's this gadget supposed to do?",1050.75,1052.76],[314,"B","It's designed to measure energy consumption in real time.",1052.822,1056.46],[315,"A","What features does it come with?",1056.548,1058.31],[316,"B","It operates on solar power and has a wireless connection.",1058.385,1061.72],[317,"A","That's very impressive! Is it easy to use?",1061.808,1064.94],[318,"B","Yes, it's multipurpose and very user-friendly.",1065.04,1068.13]]},{"p":3,"n":"Making Direct Comparisons Between Products","h":[[319,"A","How does Model A compare to Model B?",1068.242,1070.58],[320,"B","Model A is much lighter and easier to carry than Model B.",1070.655,1074.8],[321,"A","Does it have more storage capacity as well?",1074.875,1077.22],[322,"B","Yes, Model A has far more storage space than Model B.",1077.32,1081.06],[323,"A","Is Model B cheaper than Model A?",1081.135,1083.34],[324,"B","Model B is slightly less expensive, but it has fewer features.",1083.428,1087.37]]},{"p":3,"n":"Describing Shapes and Geometry","h":[[325,"A","What shape is the new conference table?",1087.458,1090.06],[326,"B","It's rectangular with rounded semicircular ends.",1090.148,1093.49],[327,"A","And what about the lighting fixture above it?",1093.578,1095.72],[328,"B","It's cylindrical, made of frosted glass and chrome.",1095.795,1099.13],[329,"A","That sounds like a very modern design!",1099.218,1101.72],[330,"B","It really is! It looks great in the office.",1101.808,1105.01]]},{"p":3,"n":"Asking How to Operate a Device","h":[[331,"A","How can I operate this coffee machine?",1105.11,1107.39],[332,"B","First of all, you need to fill the water tank to the mark.",1107.478,1110.89],[333,"A","Okay, got it. What do I do next?",1110.99,1113.19],[334,"B","Next, insert the pod and press the start button.",1113.265,1116.45],[335,"A","What am I doing wrong? Nothing is happening.",1116.538,1119.52],[336,"B","Make sure to lock the lid down firmly before pressing start.",1119.608,1123.41]]},{"p":3,"n":"Step-by-Step Instructions for Recording","h":[[337,"A","Could you show me how to record a message on this system?",1123.498,1126.34],[338,"B","To start off, press the menu key on the handset.",1126.415,1129.75],[339,"A","Right. What's the next step?",1129.8,1131.74],[340,"B","After that, scroll down to Record and press Select.",1131.84,1135.41],[341,"A","When do I start speaking?",1135.498,1137.26],[342,"B","When you hear the beep, begin speaking clearly into the mic.",1137.348,1141.12]]},{"p":3,"n":"Giving Words of Caution and Confirmation","h":[[343,"A","Am I doing this correctly?",1141.22,1142.97],[344,"B","Hold it a second! Be careful not to press down too hard.",1143.082,1146.74],[345,"A","Oh, thanks! I almost forced the lever.",1146.828,1149.98],[346,"B","Take care to turn the knob gently to the right.",1150.068,1152.84],[347,"A","Like this?",1152.915,1154.69],[348,"B","That's it! Now you've got it! You're cooking with gas!",1154.778,1158.24]]},{"p":3,"n":"Evaluating Product Quality","h":[[349,"A","I'm really impressed with the build quality of this machine.",1158.328,1161.53],[350,"B","The sound quality boggles my mind as well! It's crystal clear.",1161.618,1165.9],[351,"A","The innovative design really knocks my socks off!",1165.962,1169.21],[352,"B","Wonders will never cease! Technology keeps getting better.",1169.31,1173.39],[353,"A","It's definitely worth every penny.",1173.465,1175.89],[354,"B","I couldn't agree more!",1175.99,1177.74]]},{"p":3,"n":"Discussing Product Popularity and Availability","h":[[355,"A","Where can I buy one of these new smartwatches?",1177.828,1180.43],[356,"B","They are sold at major electronics stores or online.",1180.53,1184.2],[357,"A","Are they in high demand right now?",1184.288,1186.34],[358,"B","Yes, espresso machines and smartwatches are the latest rage.",1186.415,1190.61],[359,"A","I heard stores can hardly keep them in stock.",1190.71,1193.39],[360,"B","That's true! Everybody's buying them right now.",1193.478,1196.61]]},{"p":3,"n":"Explaining How a Household Appliance Works","h":[[361,"A","What's this contraption on the counter used for?",1196.71,1199.32],[362,"B","It's a blender designed to make smoothies in seconds.",1199.395,1202.44],[363,"A","How does it work exactly?",1202.54,1204.29],[364,"B","You put your fresh fruit in, lock the container, and push pulse.",1204.365,1208.37],[365,"A","Is it dishwasher safe?",1208.458,1210.22],[366,"B","Yes, the glass container and lid are completely dishwasher safe.",1210.295,1215.09],[367,"A","That's super convenient! I might buy one for my kitchen.",1215.178,1218.83],[368,"B","You should! It saves a lot of time in the morning.",1218.905,1222.05]]},{"p":3,"n":"Detailed Product Comparison (Superlatives)","h":[[369,"A","Which of these three cameras is the best choice?",1222.125,1224.98],[370,"B","Camera C is by far the most advanced and easiest to use.",1225.055,1228.7],[371,"A","Is it also the most expensive of the group?",1228.775,1231.08],[372,"B","Yes, but Camera A isn't nearly as good as Camera C in low light.",1231.168,1235.57],[373,"A","How about Camera B?",1235.67,1237.42],[374,"B","Camera B is a lot lighter, but it has fewer functions.",1237.508,1241.04],[375,"A","I see! So Camera C offers the highest performance overall.",1241.14,1245.43],[376,"B","Exactly! In the final analysis, Camera C is the top pick.",1245.53,1250.3]]},{"p":3,"n":"Using Nondescript Words for Unknown Objects","h":[[377,"A","Please hand me that thingamabob over on the workbench.",1250.4,1253.76],[378,"B","Do you mean this small metallic doodad here?",1253.848,1256.52],[379,"A","Yes, that's the doohickey I need for fixing the brake.",1256.595,1260.14],[380,"B","What am I supposed to do with this extra attachment?",1260.228,1262.92],[381,"A","That widget connects the cable to the main frame.",1262.97,1265.85],[382,"B","Ah, got it! Here you go.",1265.938,1268.27],[383,"A","Thanks! That saved me a lot of hassle.",1268.37,1271.2],[384,"B","No problem at all!",1271.288,1273.05]]},{"p":3,"n":"Guiding Someone Through Software Setup","h":[[385,"A","I can't figure out how to install this software update.",1273.188,1276.1],[386,"B","First off, download the setup file from the official website.",1276.25,1280.01],[387,"A","Okay, I've downloaded it. What's the initial step?",1280.098,1282.96],[388,"B","Double-click the icon and make sure to accept the agreement.",1283.035,1286.73],[389,"A","What do I do next?",1286.818,1288.58],[390,"B","Following that, select the destination folder and click Install.",1288.705,1293.07],[391,"A","Awesome! It says installation complete!",1293.158,1296.05],[392,"B","That's right! Now you're all set to go!",1296.15,1299.17]]},{"p":3,"n":"Troubleshooting a Malfunctioning Machine","h":[[393,"A","Why doesn't this printer seem to work?",1299.258,1301.26],[394,"B","How come nothing happens when you press print?",1301.372,1303.88],[395,"A","I have no idea! I can't seem to get this to work at all.",1303.968,1307.72],[396,"B","Let's check if the paper tray is jammed or empty.",1307.808,1311.03],[397,"A","Ah, look! The red light is flashing near the paper icon.",1311.118,1315.21],[398,"B","That explains it! You just need to reload the paper tray.",1315.298,1319.19],[399,"A","Now it's printing! Thanks for helping me out.",1319.265,1321.93],[400,"B","Glad we figured it out so quickly!",1322.03,1325.0]]},{"p":4,"n":"Noticing Something Is Wrong","h":[[401,"A","You don't seem to be yourself today. Is anything the matter?",1325.088,1328.53],[402,"B","To be honest, I'm really bothered about my financial situation.",1328.605,1332.59],[403,"A","What seems to be the main trouble?",1332.678,1334.61],[404,"B","I'm a little short on cash this month and having trouble making ends meet.",1334.698,1338.79],[405,"A","I'm sorry to hear that! Is there anything I can do to help?",1338.878,1342.17],[406,"B","Thanks for caring! Just talking about it helps get it off my chest.",1342.332,1347.09]]},{"p":4,"n":"Asking for Advice Privately","h":[[407,"A","I've got this problem with my workload, and I need some advice.",1347.178,1351.05],[408,"B","Of course! What's on your mind?",1351.125,1353.52],[409,"A","I hope you'll keep quiet about this and keep it to yourself.",1353.608,1357.0],[410,"B","Don't worry! My lips are sealed; I promise not to tell a soul.",1357.1,1361.56],[411,"A","Thanks! I feel like my biology class is just killing me lately.",1361.648,1366.53],[412,"B","I understand. Have you considered asking for a tutor?",1366.618,1370.01]]},{"p":4,"n":"Identifying Causes of Problems","h":[[413,"A","How did this whole misunderstanding come about?",1370.122,1372.94],[414,"B","It all happened because of a miscommunication in the email thread.",1373.04,1377.24],[415,"A","Whose responsibility was it to send the final schedule?",1377.352,1380.79],[416,"B","I take full responsibility—I blew it by forgetting the attachment.",1380.952,1385.23],[417,"A","Don't take it so hard. It was an unintentional mistake.",1385.305,1389.07],[418,"B","Thanks for understanding. I'll resend it right away.",1389.182,1392.57]]},{"p":4,"n":"Making Helpful Suggestions","h":[[419,"A","I'm constantly feeling stressed out before exams.",1392.658,1395.76],[420,"B","May I suggest doing some light exercise or yoga before studying?",1395.848,1399.98],[421,"A","I never thought of that! Does it really make a difference?",1400.068,1403.2],[422,"B","Yes! You might also want to try breaking your study time into chunks.",1403.288,1407.98],[423,"A","That makes a lot of sense! I'll give it a try tonight.",1408.068,1411.2],[424,"B","Great! I'm sure you'll feel much more relaxed.",1411.275,1414.51]]},{"p":4,"n":"Offering Direct Advice","h":[[425,"A","I'm always running out of money before the end of the month.",1414.61,1417.61],[426,"B","The best thing to do would be to make a weekly budget.",1417.698,1420.61],[427,"A","That's easier said than done when unexpected expenses pop up.",1420.71,1424.38],[428,"B","If I were you, I'd set aside an emergency fund first.",null,null],[429,"A","Thanks for the advice! That's the best idea I've heard.",1424.492,1427.84],[430,"B","All you have to do is stick to it consistently!",1427.94,1430.74]]},{"p":4,"n":"Expressing Sympathy and Comfort","h":[[431,"A","I just received news that I didn't get the job promotion.",1430.828,1433.91],[432,"B","Oh, what a pity! I'm so sorry to hear that!",1434.01,1437.03],[433,"A","I had my heart set on getting that position.",1437.118,1439.69],[434,"B","I can imagine how disappointed you must feel right now.",1439.778,1442.93],[435,"A","Yeah, I'm feeling pretty down in the dumps today.",1443.018,1446.15],[436,"B","Don't lose heart! I'm sure better opportunities will come your way.",1446.225,1450.3]]},{"p":4,"n":"Reassuring Someone Who Is Worried","h":[[437,"A","I'm just a bundle of nerves about tomorrow's presentation!",1450.388,1453.83],[438,"B","Take it easy! There's no need to freak out.",1453.905,1456.64],[439,"A","What if I freeze up and forget my main points?",1456.728,1459.62],[440,"B","Rest assured that you have prepared thoroughly for this.",1459.708,1462.6],[441,"A","Do you really think everything will go smoothly?",1462.675,1465.6],[442,"B","I'm positive! Everything's going to turn out just fine.",1465.688,1469.39]]},{"p":4,"n":"Expressing Reluctance to Discuss a Topic","h":[[443,"A","Why so glum today? Anything bothering you?",1469.49,1472.77],[444,"B","I'd really rather not discuss it right now if you don't mind.",1472.908,1477.04],[445,"A","I understand. I didn't mean to pry into your personal business.",1477.128,1481.14],[446,"B","Thanks for understanding. I just need some space to think.",1481.252,1484.76],[447,"A","Take your time. Let me know whenever you feel like talking.",1484.835,1488.34],[448,"B","I appreciate that. Thanks.",1488.428,1490.74]]},{"p":4,"n":"Making Someone Aware of an Issue","h":[[449,"A","There's something I've been meaning to bring up with you.",1490.828,1493.28],[450,"B","Oh, really? What is it?",1493.368,1495.27],[451,"A","Don't be offended, but loud noise late at night gets on my nerves.",1495.358,1499.73],[452,"B","I'm so sorry! It's come to my attention that my TV was too loud.",1499.83,1504.29],[453,"A","Thanks for understanding! I really appreciate your cooperation.",1504.402,1508.25],[454,"B","No problem at all! I'll make sure to keep the volume down.",1508.338,1512.14]]},{"p":4,"n":"Offering Assistance to a Stranger","h":[[455,"A","Is there anything I can do to help you with those heavy bags?",1512.24,1515.28],[456,"B","Oh, that's very kind of you! Could you give me a hand?",1515.368,1518.54],[457,"A","Here, let me carry this large box for you.",1518.628,1521.42],[458,"B","Thank you so much! I really appreciate your assistance.",1521.532,1525.24],[459,"A","It's no trouble at all! Where are you taking these?",1525.328,1528.53],[460,"B","Just to my car parked right outside. Thanks again!",1528.618,1532.15]]},{"p":4,"n":"Complaining About Service and Finding a Fix","h":[[461,"A","I hate to trouble you, but our room heater isn't working properly.",1532.25,1536.57],[462,"B","I'm terribly sorry to hear that, sir! What seems to be the issue?",1536.658,1540.53],[463,"A","It's making a strange noise and blowing cold air.",1540.618,1543.72],[464,"B","We'll see to it right away and send a technician up.",1543.795,1546.48],[465,"A","I appreciate your prompt help with this inconvenience.",1546.58,1549.96],[466,"B","If we can't fix it immediately, we'll gladly move you to another room.",1550.048,1554.3],[467,"A","That sounds very reasonable. Thank you!",1554.4,1557.2],[468,"B","You're very welcome! Sorry for the trouble.",1557.288,1560.06]]},{"p":4,"n":"Putting Things in Perspective for a Stressed Friend","h":[[469,"A","I made a tiny error on my report and my boss pointed it out!",1560.148,1564.19],[470,"B","Don't make a mountain out of a molehill! It was just a minor slip.",1564.29,1568.22],[471,"A","I could die of embarrassment! I feel so foolish.",1568.308,1571.89],[472,"B","Come back to earth! Everyone makes small mistakes occasionally.",1571.965,1575.83],[473,"A","Do you really think it won't affect my performance review?",1575.918,1578.78],[474,"B","Not at all! Get over it and focus on your great work.",1578.842,1582.5],[475,"A","You're right. I shouldn't take it so seriously to heart.",1582.55,1585.98],[476,"B","Exactly! Now let's go grab a cup of coffee.",1586.055,1589.27]]},{"p":4,"n":"Handling Misplaced Blame","h":[[477,"A","Why did you blame me for the lost files?",1589.37,1592.1],[478,"B","I was under the impression that you were responsible for them.",1592.188,1595.6],[479,"A","Well, your guess is as good as mine, but it wasn't my fault!",1595.688,1599.46],[480,"B","I see now that I screwed up by assuming that without checking.",1599.548,1603.01],[481,"A","I accept your apology, but please check the facts next time.",1603.135,1607.11],[482,"B","I promise to be much more careful in the future.",1607.198,1610.59],[483,"A","Fair enough! Let's work together to find where they are.",1610.79,1614.5],[484,"B","Agreed! Thanks for being understanding.",1614.588,1617.19]]},{"p":4,"n":"Giving Advice to Someone Homesick","h":[[485,"A","I miss my family so much, and I feel really lonely in this new city.",1617.278,1622.25],[486,"B","I know how hard it can be when you're feeling homesick.",1622.338,1625.51],[487,"A","Has it ever occurred to you how difficult adjusting can be?",1625.61,1628.87],[488,"B","Yes! What you need is to get out and meet people with shared interests.",1628.945,1633.74],[489,"A","Why don't you try joining a local conversation club or volunteering?",1633.828,1637.94],[490,"B","That just might be the answer! I'll give it a try this weekend.",1638.04,1641.78],[491,"A","Good idea! You'll feel right at home in no time.",1641.88,1645.21],[492,"B","Thanks for your encouraging words!",1645.335,1647.44]]},{"p":4,"n":"Checking Progress After Receiving Assistance","h":[[493,"A","How did your project turn out after using that new template?",1647.54,1650.68],[494,"B","Thanks for your advice—it worked out brilliantly!",1650.78,1653.9],[495,"A","I'm so glad to hear that! Was it easy to implement?",1653.988,1657.28],[496,"B","Yes! All I had to do was follow the guidelines you suggested.",1657.355,1661.26],[497,"A","That's fantastic news! I knew you could handle it.",1661.348,1664.74],[498,"B","I couldn't have done it without your assistance!",1664.84,1667.4],[499,"A","Anytime! I'm always happy to help out.",1667.462,1670.28],[500,"B","Thanks a million!",1670.43,1671.6]]},{"p":5,"n":"Facing a Difficult Decision","h":[[501,"A","We need to make a decision about our office lease soon.",1671.688,1674.67],[502,"B","What are our options and alternatives at this point?",1674.758,1677.57],[503,"A","We can either renew for three years or move to a new location.",1677.645,1681.7],[504,"B","The situation calls for a careful evaluation of pros and cons.",1681.788,1686.16],[505,"A","In the final analysis, cost will be the decisive factor.",1686.26,1689.83],[506,"B","I agree. Let's weigh the advantages and disadvantages carefully.",1689.918,1694.2]]},{"p":5,"n":"Stating Reasons and Motivation","h":[[507,"A","What is your main motivation for taking evening classes?",1694.288,1697.73],[508,"B","I'm taking classes so that I can qualify for a promotion.",1697.818,1702.0],[509,"A","Because the job market is competitive, extra skills really help.",1702.075,1706.13],[510,"B","Consequentially, I'm investing my free time in self-improvement.",1706.292,1710.52],[511,"A","That's a very smart strategy! What is your ultimate goal?",1710.608,1714.34],[512,"B","My goal is to become a project manager within two years.",1714.415,1718.54]]},{"p":5,"n":"Persuading Someone to Take Action","h":[[513,"A","Don't you think it's a great idea to apply for that new job opening?",1718.628,1721.97],[514,"B","I don't know... I'm getting cold feet about leaving my current company.",1722.058,1726.53],[515,"A","What have you got to lose by sending in your application?",1726.618,1729.46],[516,"B","I suppose you're right. Changing jobs won't kill me!",1729.548,1733.01],[517,"A","Think of what you have to gain! Trust me, it's for the best.",1733.198,1736.75],[518,"B","Okay, you've convinced me! I'll update my resume tonight.",1736.85,1740.25]]},{"p":5,"n":"Expressing Urgency and Setting Deadlines","h":[[519,"A","This proposal is of utmost importance and high priority.",1740.325,1744.02],[520,"B","When do we need to submit the final draft?",1744.095,1746.85],[521,"A","We can't wait on this—the deadline is set for Friday at noon.",1746.938,1750.81],[522,"B","There's no time to waste then! Let's get straight to work.",1750.91,1754.39],[523,"A","Is everybody on the same page regarding their assignments?",1754.465,1758.16],[524,"B","Yes, we all see eye to eye on the task division.",1758.235,1761.26]]},{"p":5,"n":"Stating a Choice and Commitment","h":[[525,"A","Have you made up your mind about which laptop to buy?",1761.36,1764.57],[526,"B","Yes, I've opted for the high-performance model.",1764.67,1767.55],[527,"A","That's a solid choice! Have you taken the first step to order it?",1767.638,1771.56],[528,"B","I've just placed the order online a few minutes ago.",1771.648,1774.42],[529,"A","Awesome! Can I count you in for our software project now?",1774.508,1778.31],[530,"B","You can definitely count me in! I'm fully committed.",1778.398,1781.62]]},{"p":5,"n":"Hesitation, Indecision, and Delays","h":[[531,"A","Are you ready to sign the contract today?",1781.708,1783.95],[532,"B","I'm still seesawing back and forth. I can't say one way or another.",1784.038,1788.7],[533,"A","What's holding you back from making a decision?",1788.788,1791.27],[534,"B","I need to sleep on it and mull it over a bit longer.",1791.358,1794.89],[535,"A","That's understandable. We shouldn't make any hasty moves.",1794.978,1798.61],[536,"B","Thanks for understanding! Tomorrow's another day.",1798.748,1801.92]]},{"p":5,"n":"Discussing Short-Term Plans","h":[[537,"A","Got any exciting plans for the upcoming summer weekend?",1801.995,1805.09],[538,"B","I'm planning to go camping with some friends in the mountains.",1805.178,1808.28],[539,"A","What do you have in mind for Sunday afternoon?",1808.368,1810.9],[540,"B","We intend to go kayaking on the lake before heading home.",1810.988,1814.38],[541,"A","That sounds like an amazing getaway! Have fun!",1814.468,1817.96],[542,"B","Thanks! Are you doing anything special yourself?",1818.035,1821.39]]},{"p":5,"n":"Formulating Long-Term Goals","h":[[543,"A","Where do you see yourself in five years' time?",1821.49,1824.05],[544,"B","I'm setting my sights on starting my own boutique agency.",1824.15,1827.75],[545,"A","That's an ambitious goal! How do you plan to achieve it?",1827.838,1831.04],[546,"B","I'm working toward gaining management experience first.",1831.14,1834.3],[547,"A","I have no doubt you'll make your dream come true.",1834.388,1837.37],[548,"B","Thank you! I'm determined to work hard for it.",1837.495,1840.47]]},{"p":5,"n":"Congratulating Someone on an Achievement","h":[[549,"A","I just heard you passed your professional certification exam!",1840.57,1843.97],[550,"B","Yes! I finally got the results this morning.",1844.058,1847.11],[551,"A","Congratulations! You deserve a lot of recognition for your hard work.",1847.172,1851.74],[552,"B","Thank you so much! I'm really relieved and excited.",1851.865,1855.41],[553,"A","We should definitely celebrate this big milestone!",1855.498,1858.67],[554,"B","Sounds great! Dinner on Friday is on me!",1858.745,1861.81]]},{"p":5,"n":"Reaching a Compromise","h":[[555,"A","We have different opinions on the budget allocation.",1861.91,1864.74],[556,"B","I'm sure we can figure something out if we negotiate.",1864.84,1867.81],[557,"A","Let's meet halfway and split the remaining funds equally.",1867.885,1871.22],[558,"B","That sounds like a fair give and take for both departments.",1871.308,1874.58],[559,"A","We've found a happy medium then!",1874.668,1876.6],[560,"B","Great! Let me update the official plan accordingly.",1876.675,1880.01]]},{"p":5,"n":"Navigating Career Alternatives","h":[[561,"A","I'm considering quitting my job to go back to school full-time.",1880.098,1884.33],[562,"B","What choice or alternative do you have if you stay?",1884.43,1887.16],[563,"A","If I stay, my growth potential is somewhat limited.",1887.248,1891.02],[564,"B","What are the advantages and disadvantages of studying full-time?",1891.12,1894.93],[565,"A","The main advantage is finishing faster, but money will be tight.",1895.018,1899.01],[566,"B","When all's said and done, you have to do what aligns with your goals.",1899.085,1902.92],[567,"A","I've decided to take out a student loan and pursue the degree.",1903.008,1906.66],[568,"B","Good for you! I fully support your decision.",1906.76,1909.71]]},{"p":5,"n":"Planning a Company Event Schedule","h":[[569,"A","How can we go about setting deadlines for the annual seminar?",1909.81,1913.17],[570,"B","We should walk through the schedule again step by step.",1913.258,1915.95],[571,"A","Let me set the registration deadline for the end of the month.",1916.038,1919.31],[572,"B","Is everybody on the same page regarding the speaker lineup?",1919.385,1922.89],[573,"A","Yes, all speakers have confirmed their participation.",1922.952,1926.39],[574,"B","Great! The crux of the matter now is marketing the event.",1926.49,1930.3],[575,"A","I've taken the first step toward launching the ad campaign.",1930.475,1933.9],[576,"B","Excellent work! Everything is coming together nicely.",1933.962,1937.81]]},{"p":5,"n":"Expressing Disappointment and Adjusting Plans","h":[[577,"A","How was the exhibition you were looking forward to?",1937.922,1941.1],[578,"B","To be honest, it really let me down. It was disorganized.",1941.175,1945.52],[579,"A","Oh, what a shame! You had your hopes up for months.",1945.608,1948.76],[580,"B","I know! I had my heart set on seeing the rare manuscripts.",1948.86,1952.91],[581,"A","Well, don't let it ruin your entire weekend!",1953.01,1956.13],[582,"B","You're right. I'm going to change my plans and visit the botanical gardens.",1956.18,1960.69],[583,"A","That sounds like a delightful alternative!",1960.778,1963.14],[584,"B","I'm sure it will be much more enjoyable!",1963.228,1965.68]]},{"p":5,"n":"Consensus-Building in a Team Project","h":[[585,"A","Who's in favor of adopting the new software framework?",1965.805,1969.11],[586,"B","I'm fully in favor! It will streamline our workflow.",1969.198,1972.78],[587,"A","Do I have everyone's support before we make the final call?",1972.88,1976.19],[588,"B","Yes, the whole team is backing this decision.",1976.278,1979.38],[589,"A","This is the deal: we start transition training next Monday.",1979.468,1983.22],[590,"B","Understood! We'll set up the preparation schedule right away.",1983.308,1986.75],[591,"A","Great! I appreciate everyone's cooperation.",1986.825,1990.06],[592,"B","We're all eager to get started!",1990.135,1991.98]]},{"p":5,"n":"Reflecting on Personal Growth and Future Commitments","h":[[593,"A","What dream have you always wanted to accomplish?",1992.068,1995.12],[594,"B","I've always dreamed of writing a book on intercultural communication.",1995.22,1999.49],[595,"A","What's stopping you from taking the first step today?",1999.59,2002.35],[596,"B","Honestly, nothing! I've made up my mind to start writing this weekend.",2002.438,2006.67],[597,"A","That's fantastic! How many hours a week will you dedicate to it?",2006.77,2010.85],[598,"B","I'm committing to at least five hours every weekend.",2010.938,2014.04],[599,"A","Consistency is key! You'll have a draft ready before you know it.",2014.128,2018.29],[600,"B","Thanks for the encouragement! I'm ready for the challenge.",2018.402,2021.48]]},{"p":6,"n":"Asking for and Stating an Opinion","h":[[601,"A","What's your take on the city's plan to build a new transit line?",2021.568,2025.44],[602,"B","In my opinion, public transportation should definitely be expanded.",2025.528,2029.64],[603,"A","From my perspective, it will reduce traffic congestion significantly.",2029.752,2034.51],[604,"B","I couldn't agree with you more! It's a win-win for everyone.",2034.598,2038.28],[605,"A","If you ask me, it's about time they invested in infrastructure.",2038.368,2042.67],[606,"B","You've hit the nail on the head!",2042.758,2044.52]]},{"p":6,"n":"Expressing Strong Agreement","h":[[607,"A","I firmly believe that foreign language learning should start early.",2044.608,2048.36],[608,"B","My thoughts exactly! Younger children absorb languages effortlessly.",2048.448,2052.82],[609,"A","Studies show that early immersion improves cognitive skills immensely.",2052.92,2057.31],[610,"B","You took the words right out of my mouth! Statistics prove it.",2057.398,2061.25],[611,"A","So we are in complete agreement on this topic?",2061.338,2064.08],[612,"B","I agree with you 100 percent without a doubt.",2064.168,2066.86]]},{"p":6,"n":"Polite Disagreement in a Discussion","h":[[613,"A","As I see it, working from home is far superior to working in an office.",2066.948,2071.23],[614,"B","I have to beg to differ on that point.",2071.318,2073.68],[615,"A","Really? Why don't you share my viewpoint?",2073.755,2076.22],[616,"B","I feel that in-person collaboration fosters much stronger team unity.",2076.345,2081.14],[617,"A","I see your point, but remote work offers far better work-life balance.",2081.24,2085.8],[618,"B","That's a valid argument, though it depends on individual roles.",2085.9,2089.57]]},{"p":6,"n":"Strong Disagreement and Counterarguments","h":[[619,"A","Some people argue that printed books will completely disappear soon.",2089.67,2093.65],[620,"B","I disagree completely! That's a total exaggeration.",2093.738,2097.59],[621,"A","On what grounds do you challenge that prediction?",2097.678,2100.35],[622,"B","Sales figures indicate that print book sales remain exceptionally high.",2100.45,2104.84],[623,"A","I'd like to point out that digital convenience is growing fast, though.",2104.928,2109.16],[624,"B","True, but print books offer a tactile experience digital screens can't match.",2109.235,2114.18]]},{"p":6,"n":"Expressing Indifference","h":[[625,"A","Which side of the debate on uniform policies do you support?",2114.28,2117.9],[626,"B","To be honest, it doesn't matter to me one way or another.",2117.975,2122.0],[627,"A","Really? You don't have a strong position on the issue?",2122.075,2125.22],[628,"B","It's six of one and half a dozen of the other to me.",2125.295,2128.05],[629,"A","Fair enough. Some issues just aren't worth getting excited about.",2128.2,2132.11],[630,"B","Exactly. It's all the same as far as I'm concerned.",2132.185,2135.54]]},{"p":6,"n":"Supporting Opinions with Facts and Statistics","h":[[631,"A","What evidence is there that renewable energy is becoming cost-effective?",2135.628,2140.12],[632,"B","Recent statistics demonstrate that solar power costs have dropped by 80%.",2140.195,2144.73],[633,"A","Those figures clearly support the argument for green transition.",2144.805,2148.47],[634,"B","Precisely! Research shows that clean energy creates millions of jobs.",2148.558,2153.39],[635,"A","I find those numbers very convincing indeed.",2153.478,2156.51],[636,"B","The facts speak for themselves!",2156.61,2158.62]]},{"p":6,"n":"Addressing Generalizations in Debates","h":[[637,"A","It's often said that young people don't read news anymore.",2158.695,2161.79],[638,"B","I think that's a broad generalization that isn't entirely true.",2161.878,2165.61],[639,"A","How do you mean? They mostly get information from social media.",2165.722,2169.79],[640,"B","Yes, but many follow reputable news outlets on digital platforms.",2169.878,2174.66],[641,"A","That's a good point. We shouldn't lump everyone together.",2174.748,2178.21],[642,"B","Exactly! Generalizations often obscure the subtle reality.",2178.298,2182.82]]},{"p":6,"n":"Reacting with Disbelief to Outrageous Claims","h":[[643,"A","Did you hear that gasoline prices might double by next month?",2182.908,2186.32],[644,"B","You can't be serious! That sounds completely unbelievable.",2186.408,2190.54],[645,"A","I read an article claiming it's due to supply chain disruptions.",2190.628,2194.4],[646,"B","You've got to be pulling my leg! That has to be a rumor.",2194.488,2197.76],[647,"A","I certainly hope so! Doubling prices would be devastating.",2197.848,2201.82],[648,"B","There's no way on earth that happens overnight!",2201.932,2204.82]]},{"p":6,"n":"Making a Value Judgment","h":[[649,"A","What's your reaction to the company's new environmental policy?",2204.92,2208.2],[650,"B","I think it's a step in the right direction, though long overdue.",2208.3,2211.92],[651,"A","I strongly favor their plan to eliminate single-use plastics.",2212.02,2216.5],[652,"B","Me, too! It shows genuine corporate social responsibility.",2216.575,2221.3],[653,"A","It sets a positive example for other businesses in the sector.",2221.388,2225.0],[654,"B","Without a doubt! It's a commendable move.",2225.088,2227.78]]},{"p":6,"n":"Asking for Agreement explicitly","h":[[655,"A","The way I look at it, team morale is our top priority.",2227.855,2231.62],[656,"B","Are you with me on this, Mark?",2231.708,2233.47],[657,"A","I hear you loud and clear, and I concur entirely.",2233.57,2236.78],[658,"B","Do we all see eye to eye on taking immediate steps?",2236.868,2239.85],[659,"A","Yes, we are all in complete agreement.",2239.925,2242.56],[660,"B","Great! Let's draft our recommendations right now.",2242.66,2245.8]]},{"p":6,"n":"Debating Urban Planning and Green Spaces","h":[[661,"A","What's your stand on turning the old waterfront into a commercial center?",2245.9,2249.88],[662,"B","I'm firmly opposed to building more commercial malls there.",2249.968,2253.34],[663,"A","What should they do instead from your perspective?",2253.428,2256.0],[664,"B","What they should do instead is convert it into a public park.",2256.088,2259.55],[665,"A","I support that idea completely! Cities need more green spaces.",2259.638,2263.89],[666,"B","According to urban studies, parks boost public mental health by 30%.",2263.978,2268.76],[667,"A","Those statistics make a compelling argument for a park!",2268.848,2272.17],[668,"B","They certainly do! Let me voice this opinion at the town hall meeting.",2272.258,2276.97]]},{"p":6,"n":"Discussing Educational Methods","h":[[669,"A","Where do you stand on standardized testing in schools?",2277.07,2280.09],[670,"B","As far as I'm concerned, standardized tests place too much pressure on students.",2280.19,2285.18],[671,"A","Don't you think tests provide a useful measure of academic progress?",2285.268,2289.02],[672,"B","That's a valid point, but they don't capture creativity or problem-solving.",2289.108,2293.7],[673,"A","I agree to some extent, but how else can we evaluate performance?",2293.788,2297.78],[674,"B","A combination of project work and continuous assessment is much better.",2297.868,2302.44],[675,"A","I see where you're coming from with that suggestion.",2302.528,2305.15],[676,"B","It offers a far more balanced evaluation overall.",2305.225,2308.46]]},{"p":6,"n":"Navigating Difference of Opinion Respectfully","h":[[677,"A","I personally believe advertising targeted at young children should be banned.",2308.598,2313.04],[678,"B","I'm afraid I don't see it that way at all.",2313.128,2315.92],[679,"A","Why do you disagree with restricting commercial ads?",2316.008,2319.02],[680,"B","I advocate for parental guidance rather than government bans.",2319.108,2322.86],[681,"A","I understand your position, but kids can be easily influenced.",2322.948,2326.63],[682,"B","That's true, but parents should teach media literacy at home.",2326.73,2330.64],[683,"A","We might have to agree to disagree on where the responsibility lies.",2330.74,2334.74],[684,"B","Fair enough! Respectful debate is always healthy.",2334.952,2338.72]]},{"p":6,"n":"Evaluating Technological Impact on Society","h":[[685,"A","It appears to me that artificial intelligence will transform every industry.",2338.82,2343.52],[686,"B","I completely share your view! The pace of innovation is extraordinary.",2343.62,2348.54],[687,"A","Some worry that AI will lead to widespread job displacement, though.",2348.64,2353.08],[688,"B","I'm convinced that while some jobs will change, new roles will emerge.",2353.155,2357.64],[689,"A","History shows that technological shifts create new opportunities over time.",2357.74,2362.25],[690,"B","Exactly! You've hit the nail right on the head.",2362.35,2365.3],[691,"A","So we should focus on retraining and adaptation.",2365.388,2368.49],[692,"B","Unequivocally, yes!",2368.565,2370.34]]},{"p":6,"n":"Summarizing a Structured Opinion Discussion","h":[[693,"A","To sum up our discussion, where do we stand on the proposed budget?",2370.415,2374.52],[694,"B","The majority of us strongly favor reallocating funds to research.",2374.595,2378.7],[695,"A","Are there any dissenters who wish to state an opposing view?",2378.788,2382.18],[696,"B","I have a mild objection regarding marketing cuts, but I accept the majority.",2382.268,2386.81],[697,"A","Thank you for sharing your perspective, John.",2386.96,2389.69],[698,"B","I appreciate that everyone had an opportunity to voice their thoughts.",2389.778,2394.23],[699,"A","Our opinion paper is now solid and grounded in good arguments.",2394.305,2398.93],[700,"B","Great job, team! Let's submit the final report.",2399.005,2402.55]]},{"p":7,"n":"Opening a Group Discussion Formal","h":[[701,"A","I now call the meeting to order. Welcome, everyone.",2402.638,2406.58],[702,"B","Thank you for leading today's session, Abdulaziz.",2406.742,2409.94],[703,"A","I'll begin by thanking everyone for attending on such short notice.",2410.028,2414.31],[704,"B","We're glad to be here. What is our primary topic for today?",2414.398,2418.34],[705,"A","Our topic for today's discussion is the new international project.",2418.415,2422.64],[706,"B","Great! Let's get the ball rolling.",2422.715,2425.06]]},{"p":7,"n":"Giving a Speaker the Floor","h":[[707,"A","Who would like to open the discussion with the first remark?",2425.222,2428.13],[708,"B","If I may, I'd like to share a few initial thoughts.",2428.218,2431.56],[709,"A","The floor is yours, Natalia. Go ahead!",2431.648,2434.87],[710,"B","Thank you. First of all, I'd like to present our project timeline.",2435.02,2439.31],[711,"A","Thanks, Natalia. Now let's hear from Kevin on the budget.",2439.41,2443.56],[712,"B","Thank you, Mr. Chairman. I'll outline the financial figures.",2443.735,2447.69]]},{"p":7,"n":"Interrupting Politely in a Meeting","h":[[713,"A","Our plan is to launch the product in early spring, and then—",2447.752,2451.36],[714,"B","Sorry to interrupt, but may I jump in for just a moment?",2451.448,2454.91],[715,"A","Yes, go ahead, Costas. What would you like to add?",2454.985,2458.41],[716,"B","I just wanted to ask if spring conflicts with the trade fair schedule.",2458.498,2462.44],[717,"A","That's a very valid point! Let's check the trade fair dates.",2462.528,2466.16],[718,"B","Thanks for letting me clarify that point.",2466.285,2468.39]]},{"p":7,"n":"Handling Interruptions Firmly","h":[[719,"A","As I was explaining, our secondary objective is—",2468.478,2472.18],[720,"B","But shouldn't we focus on primary costs first?",2472.28,2475.01],[721,"A","Would you mind if I finished making my point first?",2475.098,2478.01],[722,"B","My apologies! Please go ahead and finish.",2478.085,2481.37],[723,"A","Thank you. Just let me finish this thought, and then I'll take questions.",2481.508,2486.1],[724,"B","Understood. Floor is yours.",2486.175,2488.6]]},{"p":7,"n":"Asking for Clarification and Rephrasing","h":[[725,"A","We need to optimize our synergistic digital paradigms.",2488.688,2492.3],[726,"B","I'm sorry, but I'm not quite with you. Could you rephrase that?",2492.388,2496.12],[727,"A","What I mean to say is we need to simplify our software tools.",2496.208,2500.37],[728,"B","Ah, I see! Could you give us a concrete example?",2500.458,2503.44],[729,"A","For instance, replacing three separate apps with one integrated platform.",2503.552,2508.12],[730,"B","Now that is as clear as plain day! Thank you.",2508.195,2511.62]]},{"p":7,"n":"Clearing Up Misunderstandings","h":[[731,"A","So what you're saying is we should cancel the entire campaign?",2511.72,2515.15],[732,"B","No, that wasn't quite what I intended to say.",2515.238,2518.41],[733,"A","Could you clear this up for us then?",2518.485,2520.33],[734,"B","What I'm trying to get at is simply postponing the launch by two weeks.",2520.418,2525.06],[735,"A","Oh, I see where you're coming from now! I misunderstood.",2525.148,2529.36],[736,"B","Glad we cleared that up!",2529.448,2531.21]]},{"p":7,"n":"Keeping the Discussion on Track","h":[[737,"A","Speaking of software, did anyone see that football game last night?",2531.31,2535.63],[738,"B","I'd like to bring the discussion back to our meeting topic.",2535.73,2539.37],[739,"A","Apologies! I got a bit sidetracked there.",2539.458,2542.73],[740,"B","Let's stick to the point regarding our project deliverables.",2542.83,2546.38],[741,"A","Right! Can we get back to reviewing the third quarter budget?",2546.43,2550.0],[742,"B","Yes, let's focus on the main issue at hand.",2550.075,2553.1]]},{"p":7,"n":"Asking Speakers to Be Brief","h":[[743,"A","Let me explain every historical detail starting from five years ago...",2553.15,2558.5],[744,"B","Could you be brief and cut to the chase?",2558.575,2560.85],[745,"A","Sure! In short, our client requested an updated contract.",2560.938,2565.89],[746,"B","Thank you for putting that in fewer words.",2566.128,2568.72],[747,"A","What's your point regarding their requested timeline?",2568.808,2571.46],[748,"B","The bottom line is they need final approval by tomorrow.",2571.548,2574.7]]},{"p":7,"n":"Summarizing Main Discussion Points","h":[[749,"A","Before we conclude, let's recap the main points discussed so far.",2574.788,2578.97],[750,"B","Natalia presented the timeline, and Kevin outlined the finances.",2579.058,2583.53],[751,"A","To make a long story short, we are on track and within budget.",2583.605,2587.8],[752,"B","In a nutshell, everything is set for the upcoming launch.",2587.875,2591.52],[753,"A","That's an accurate summary of our discussion!",2591.62,2594.14],[754,"B","Great! We've covered a lot of ground today.",2594.228,2597.09]]},{"p":7,"n":"Taking a Vote and Adjourning","h":[[755,"A","I'd like to move that we approve the new marketing budget.",2597.19,2600.43],[756,"B","I second the motion! Let's take a vote.",2600.53,2603.26],[757,"A","Could we have a show of hands? All in favor say aye.",2603.348,2606.52],[758,"B","The motion passes unanimously with no dissenters.",2606.595,2609.78],[759,"A","I appreciate everyone's contributions. The meeting is adjourned!",2609.868,2614.22],[760,"B","Thank you! See you all next meeting.",2614.358,2616.67]]},{"p":7,"n":"Managing Conflict and Restoring Order","h":[[761,"A","Your department completely failed to deliver the data on time!",2616.77,2620.8],[762,"B","That remark was uncalled for! You didn't give us the specs!",2620.888,2624.66],[763,"A","Order, please! Will everyone calm down and settle down?",2624.735,2628.84],[764,"B","Let's not fly off the handle or get all wound up here.",2628.928,2631.94],[765,"A","Let me remind everyone to keep a level head and stay professional.",2632.028,2636.45],[766,"B","I apologize for raising my voice. Let's look at the specs objectively.",2636.538,2640.99],[767,"A","Thank you. Now, let's address the issue constructively.",2641.165,2645.31],[768,"B","Agreed. Let's look at the timeline together.",2645.36,2648.29]]},{"p":7,"n":"Asking for Justification and Evidence","h":[[769,"A","I propose we reduce our customer support staff by half.",2648.428,2651.91],[770,"B","On what grounds do you make that bold assumption?",2651.998,2654.74],[771,"A","Automated chatbots can handle most customer inquiries now.",2654.828,2658.72],[772,"B","Where did you get those facts? Do you have data to back that up?",2658.808,2662.1],[773,"A","Our latest quarterly report shows a 40% drop in manual tickets.",2662.175,2667.26],[774,"B","Your point is well taken, but chatbots can't handle complex issues.",2667.348,2671.58],[775,"A","That's why I suggest keeping a specialized core team.",2671.68,2674.77],[776,"B","That makes much more sense than a blanket cut.",2674.87,2677.6]]},{"p":7,"n":"Fielding Audience Questions After a Presentation","h":[[777,"A","Are there any questions or comments from the floor?",2677.7,2680.6],[778,"B","If I may, I'd like to pose a question to the last speaker.",2680.688,2684.49],[779,"A","Go ahead! What would you like to ask Lin?",2684.565,2687.13],[780,"B","I'd like to ask Lin how this system handles data security.",2687.218,2690.47],[781,"A","Who'd like to respond to that question? Lin or Sergei?",2690.582,2693.93],[782,"B","I can address that issue by saying all data is encrypted end-to-end.",2694.03,2698.42],[783,"A","Does that answer your question satisfactorily?",2698.508,2701.13],[784,"B","Yes, I hear you loud and clear. Thank you!",2701.218,2704.32]]},{"p":7,"n":"Checking Understanding Across International Teams","h":[[785,"A","Has everyone understood the updated security protocol?",2704.382,2707.92],[786,"B","I just want to check if I've got this right.",2708.008,2710.34],[787,"A","So let me see if I follow: we must change passwords every 30 days?",2710.452,2715.14],[788,"B","Yes, exactly! You get my drift.",2715.228,2717.97],[789,"A","Is everyone clear on how to reset their credentials?",2718.07,2721.19],[790,"B","Yes, it's as clear as day. No confusion at all.",2721.29,2725.17],[791,"A","Excellent! If anyone has doubts later, let me know.",2725.22,2728.65],[792,"B","Will do! Thanks for clarifying.",2728.7,2731.22]]},{"p":7,"n":"Wrapping Up an Annual General Discussion","h":[[793,"A","Are there any final words or last comments on the agenda?",2731.308,2734.89],[794,"B","This is your last chance to speak now, or forever hold your peace!",2734.99,2739.19],[795,"A","I'd just like to thank the organizer for a fantastic session.",2739.29,2742.91],[796,"B","I appreciate everyone's participation and valuable input today.",2743.01,2747.18],[797,"A","Good job, everybody! That wraps it up for this year.",2747.268,2750.64],[798,"B","Same time, same place next year!",2750.702,2753.62],[799,"A","Meeting adjourned!",2753.695,2755.47],[800,"B","Thanks, everyone! Goodbye!",2755.57,2757.82]]},{"p":8,"n":"Tempering Language for Diplomacy (Direct vs Indirect)","h":[[801,"A","I don't like this seating arrangement at all.",2757.908,2760.17],[802,"B","To be more indirect and polite, you could say: 'I'd really prefer something else.'",2760.258,2764.95],[803,"A","Ah, so instead of saying 'You must leave,' what should I say?",2765.038,2769.39],[804,"B","You might say: 'I suggest that you not stay much longer under the circumstances.'",2769.478,2774.67],[805,"A","That sounds much more diplomatic and courteous!",2774.732,2778.22],[806,"B","Indeed! Tempering your language helps avoid unnecessary conflict.",2778.295,2782.78]]},{"p":8,"n":"Filing a Formal Complaint with a Landlord","h":[[807,"A","I wish to express my complete dissatisfaction with the ongoing construction noise.",2782.868,2788.13],[808,"B","What specifically seems to be the exact nature of your complaint?",2788.218,2791.75],[809,"A","For three months now, we've been putting up with constant jackhammering early in the morning.",2791.862,2797.03],[810,"B","I apologize for the inconvenience, but essential building repairs were required by law.",2797.118,2802.6],[811,"A","We are frequently forced to leave our apartments just to work in peace.",2802.688,2806.8],[812,"B","I see. Let's sit down and see how we can resolve this matter fairly.",2806.9,2811.07]]},{"p":8,"n":"Negotiating Compensation and Settling Differences","h":[[813,"A","Given the extreme disruption, we request a 20 percent rent reduction for this month.",2811.158,2816.33],[814,"B","I'm sorry, but a 20 percent reduction is completely out of the question.",2816.468,2820.77],[815,"A","If we can't reach an agreement, we may be forced to go to arbitration.",2820.858,2825.07],[816,"B","Okay, here's the deal: I'll split the difference and offer a 10 percent reduction.",2825.17,2830.21],[817,"A","Provided that you complete the heavy drilling by Friday, we can accept that deal.",2830.298,2835.35],[818,"B","Agreed! You have my word. Let's sign on the dotted line.",2835.425,2839.57]]},{"p":8,"n":"Stating Rules, Regulations, and Conditions","h":[[819,"A","What are the rules regarding handheld devices while driving here?",2839.658,2843.91],[820,"B","According to the law, using handheld mobile devices while driving is strictly prohibited.",2844.01,2849.69],[821,"A","Are drivers subject to heavy fines if they violate the rule?",2849.765,2853.36],[822,"B","Yes, drivers will be liable for a 200 dollar fine and points on their license.",2853.448,2858.95],[823,"A","First and foremost, driver safety must be high priority on the roa
